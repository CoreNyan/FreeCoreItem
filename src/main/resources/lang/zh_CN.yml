prefix: '<gradient:#4dd0e1:#80cbc4><bold>FreeCoreItem</bold></gradient> <dark_gray>»</dark_gray> '

command:
  player-only: '<red>该操作只能由玩家执行。</red>'
  no-permission: '<red>你没有权限执行此操作。</red>'
  invalid-id: '<red>物品 ID 只能包含小写字母、数字、下划线和连字符。</red>'
  item-not-found: '<red>找不到自定义物品 <white>%id%</white>。</red>'
  item-exists: '<red>自定义物品 <white>%id%</white> 已存在。</red>'
  create-success: '<green>已创建自定义物品 <white>%id%</white>。</green>'
  create-from-hand-success: '<green>已从主手物品创建 <white>%id%</white>。</green>'
  delete-success: '<green>已删除自定义物品 <white>%id%</white>。</green>'
  give-success: '<green>已给予 <white>%player%</white> <yellow>%id%</yellow> ×%amount%。</green>'
  received: '<green>你获得了 <yellow>%id%</yellow> ×%amount%。</green>'
  inventory-full: '<yellow>背包空间不足，剩余物品已掉落在脚下。</yellow>'
  empty-hand: '<red>请先在主手持有要导入的物品。</red>'
  invalid-material: '<red>无效材质：<white>%value%</white>。</red>'
  invalid-number: '<red>无效数字：<white>%value%</white>。</red>'
  invalid-boolean: '<red>布尔值必须是 true 或 false。</red>'
  invalid-enchantment: '<red>无效附魔：<white>%value%</white>。</red>'
  invalid-flag: '<red>无效物品旗标：<white>%value%</white>。</red>'
  invalid-rarity: '<red>无效稀有度：<white>%value%</white>。</red>'
  invalid-property: '<red>不可编辑的属性：<white>%value%</white>。</red>'
  invalid-action: '<red>动作必须是 right-click 或 left-click。</red>'
  invalid-operation: '<red>操作无效，请查看 /fitem help。</red>'
  save-failed: '<red>保存物品失败，请检查控制台。</red>'
  update-success: '<green>已更新 <white>%id%</white> 的 <yellow>%property%</yellow>。</green>'
  reload-success: '<green>配置、语言与物品已重载，共载入 <white>%count%</white> 件物品。</green>'
  list-header: '<aqua>已载入的自定义物品（%count%）：</aqua>'
  list-entry: '<gray>• <white>%id%</white> <dark_gray>-</dark_gray> %name%</gray>'
  list-empty: '<gray>当前没有自定义物品。</gray>'
  help:
    - '<aqua>/fitem editor [物品ID]</aqua> <gray>- 打开 GUI 编辑器</gray>'
    - '<aqua>/fitem create <ID> [材质|hand]</aqua> <gray>- 创建或从主手导入</gray>'
    - '<aqua>/fitem delete <ID></aqua> <gray>- 删除物品</gray>'
    - '<aqua>/fitem give <ID> [玩家] [数量]</aqua> <gray>- 获取物品</gray>'
    - '<aqua>/fitem list</aqua> <gray>- 查看所有物品</gray>'
    - '<aqua>/fitem set <ID> <属性> <值></aqua> <gray>- 编辑基础属性</gray>'
    - '<aqua>/fitem lore <ID> <add|set|remove|clear> ...</aqua>'
    - '<aqua>/fitem enchant <ID> <add|remove|clear> ...</aqua>'
    - '<aqua>/fitem flag <ID> <add|remove|clear> ...</aqua>'
    - '<aqua>/fitem attribute <ID> <add|clear> ...</aqua> <gray>- 编辑属性修饰符</gray>'
    - '<aqua>/fitem action <ID> <right-click|left-click> <add|remove|clear|cooldown|consume|cancel> ...</aqua>'
    - '<aqua>/fitem reload</aqua> <gray>- 重载插件</gray>'
  set-properties: '<gray>属性：material、name、amount、model、damage、max-stack、rarity、unbreakable、glint、fire-resistant、hide-tooltip</gray>'

input:
  cancel-keyword: 'cancel'
  cancelled: '<yellow>已取消输入。</yellow>'
  prompt:
    create-id: '<yellow>请在聊天中输入新物品 ID，输入 <white>%cancel%</white> 取消。</yellow>'
    material: '<yellow>请输入材质名称，例如 diamond_sword。</yellow>'
    name: '<yellow>请输入名称，支持 & 颜色符号和 MiniMessage；输入 none 清除名称。</yellow>'
    lore-add: '<yellow>请输入要追加的 lore，支持 & 颜色符号和 MiniMessage。</yellow>'
    lore-edit: '<yellow>请输入第 %line% 行的新内容，支持 & 颜色符号和 MiniMessage；输入 <white>%cancel%</white> 取消。</yellow>'
    model: '<yellow>请输入 Custom Model Data 整数；输入 none 清除。</yellow>'
    damage: '<yellow>请输入损伤值，必须大于等于 0。</yellow>'
    max-stack: '<yellow>请输入最大堆叠数 1-99；输入 none 使用材质默认值。</yellow>'
    enchant: '<yellow>请输入“附魔 等级”，例如 sharpness 5；输入 clear 清空。</yellow>'
    flag: '<yellow>请输入旗标，例如 HIDE_ATTRIBUTES；输入 clear 清空。</yellow>'
    right-action: '<yellow>请输入右键动作命令。支持 [console]、[player]、[message]；输入 clear 清空。</yellow>'
    left-action: '<yellow>请输入左键动作命令。支持 [console]、[player]、[message]；输入 clear 清空。</yellow>'

gui:
  browser:
    title: '<gradient:#4dd0e1:#80cbc4>自定义物品</gradient> <gray>(%page%/%pages%)</gray>'
    item-lore:
      - '<dark_gray>ID: %id%</dark_gray>'
      - '<gray>左键：编辑</gray>'
      - '<gray>右键：获取一件</gray>'
    previous:
      name: '<yellow>上一页</yellow>'
      lore: ['<gray>前往第 %page% 页</gray>']
    next:
      name: '<yellow>下一页</yellow>'
      lore: ['<gray>前往第 %page% 页</gray>']
    create:
      name: '<green>从主手创建</green>'
      lore:
        - '<gray>先把模板物品拿在主手</gray>'
        - '<gray>点击后在聊天中输入 ID</gray>'
    close:
      name: '<red>关闭</red>'
      lore: []
  editor:
    title: '<gradient:#4dd0e1:#80cbc4>编辑：%id%</gradient>'
    preview-lore:
      - ''
      - '<dark_gray>ID: %id%</dark_gray>'
      - '<gray>点击获取一件测试物品</gray>'
    material:
      name: '<aqua>材质</aqua>'
      lore: ['<gray>当前：<white>%value%</white></gray>', '<yellow>点击后在聊天中输入</yellow>']
    name:
      name: '<aqua>显示名称</aqua>'
      lore: ['<gray>当前名称：</gray>', '<yellow>点击后在聊天中重命名</yellow>', '<dark_gray>输入 none 可恢复原版名称</dark_gray>']
    lore:
      name: '<aqua>物品 Lore</aqua>'
      lore: ['<gray>当前行数：<white>%count%</white></gray>', '<yellow>点击进入逐行 Lore 编辑器</yellow>']
    amount:
      name: '<aqua>默认数量</aqua>'
      lore: ['<gray>当前：<white>%value%</white></gray>', '<yellow>左键 +1，右键 -1</yellow>', '<yellow>Shift 点击 ±16</yellow>']
    model:
      name: '<aqua>Custom Model Data</aqua>'
      lore: ['<gray>当前：<white>%value%</white></gray>', '<yellow>点击后在聊天中输入</yellow>']
    damage:
      name: '<aqua>损伤值</aqua>'
      lore: ['<gray>当前：<white>%value%</white></gray>', '<yellow>点击后在聊天中输入</yellow>']
    max-stack:
      name: '<aqua>最大堆叠数</aqua>'
      lore: ['<gray>当前：<white>%value%</white></gray>', '<yellow>点击后在聊天中输入</yellow>']
    rarity:
      name: '<aqua>稀有度</aqua>'
      lore: ['<gray>当前：<white>%value%</white></gray>', '<yellow>左键切换下一项，右键切换上一项</yellow>']
    unbreakable:
      name: '<aqua>不可破坏</aqua>'
      lore: ['<gray>当前：%value%</gray>', '<yellow>点击切换</yellow>']
    glint:
      name: '<aqua>强制附魔光效</aqua>'
      lore: ['<gray>当前：%value%</gray>', '<yellow>点击切换</yellow>']
    fire-resistant:
      name: '<aqua>抗火</aqua>'
      lore: ['<gray>当前：%value%</gray>', '<yellow>点击切换</yellow>']
    hide-tooltip:
      name: '<aqua>隐藏提示框</aqua>'
      lore: ['<gray>当前：%value%</gray>', '<yellow>点击切换</yellow>']
    enchant:
      name: '<light_purple>附魔</light_purple>'
      lore: ['<gray>当前数量：<white>%count%</white></gray>', '<yellow>左键输入附魔和等级</yellow>', '<red>右键清空</red>']
    flag:
      name: '<light_purple>物品旗标</light_purple>'
      lore: ['<gray>当前数量：<white>%count%</white></gray>', '<yellow>左键输入旗标</yellow>', '<red>右键清空</red>']
    right-action:
      name: '<gold>右键动作</gold>'
      lore: ['<gray>当前命令：<white>%count%</white></gray>', '<yellow>左键追加命令</yellow>', '<red>右键清空</red>']
    left-action:
      name: '<gold>左键动作</gold>'
      lore: ['<gray>当前命令：<white>%count%</white></gray>', '<yellow>左键追加命令</yellow>', '<red>右键清空</red>']
    back:
      name: '<yellow>返回物品列表</yellow>'
      lore: []
    delete:
      name: '<red>删除物品</red>'
      lore: ['<gray>点击进入删除确认界面</gray>']
  lore:
    title: '<gradient:#4dd0e1:#80cbc4>Lore 编辑：%id%</gradient>'
    line:
      name: '<aqua>第 %line% 行</aqua>'
      controls:
        - ''
        - '<yellow>左键：修改这一行</yellow>'
        - '<red>右键：删除这一行</red>'
        - '<gray>Shift + 左键：上移</gray>'
        - '<gray>Shift + 右键：下移</gray>'
    empty:
      name: '<gray>当前没有 Lore</gray>'
      lore: ['<gray>点击下方“新增一行”开始编辑</gray>']
    add:
      name: '<green>新增一行</green>'
      lore: ['<gray>在 Lore 末尾添加新行</gray>']
    clear:
      name: '<red>清空全部 Lore</red>'
      lore: ['<gray>删除当前物品的所有 Lore 行</gray>']
    back:
      name: '<yellow>返回物品编辑器</yellow>'
      lore: []
  delete:
    title: '<red>确认删除：%id%</red>'
    confirm:
      name: '<red><bold>确认删除</bold></red>'
      lore: ['<gray>此操作会删除对应 YAML 文件</gray>']
    cancel:
      name: '<green>取消</green>'
      lore: []
  common:
    enabled: '<green>启用</green>'
    disabled: '<red>禁用</red>'
    none: '<gray>无</gray>'
    filler-name: ' '

action:
  cooldown: '<yellow>该物品还需等待 <white>%seconds%</white> 秒才能再次使用。</yellow>'
